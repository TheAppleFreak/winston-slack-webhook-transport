name: Tests

on:
  push: 
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-windows:
    runs-on: windows-latest

    strategy:
      matrix: 
        node-version: [lts/-2, lts/-1, lts/*]
    
    steps: 
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with: 
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test

  test-macos:
    runs-on: macos-latest

    strategy:
      matrix: 
        node-version: [lts/-2, lts/-1, lts/*]
    
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with: 
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test

  test-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix: 
        node-version: [lts/-2, lts/-1, lts/*]
    
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with: 
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test